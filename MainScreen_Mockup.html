<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAuto Dash - Main Screen Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ------------------------------------------------------------------
           Design tokens
           ------------------------------------------------------------------ */
        :root {
            --bg-0: #03050c;
            --bg-1: #080d1c;
            --bg-2: #0e1730;

            --text: #f2f7ff;
            --text-dim: #aebbd6;
            --muted: #8593b3;

            --accent: #5ad0ff;
            --accent-2: #8b7bff;
            --accent-3: #ff5fb0;
            --good: #4ee3a5;
            --warn: #ffb454;
            --danger: #ff5d7a;

            --line: rgba(255, 255, 255, 0.12);
            --line-strong: rgba(255, 255, 255, 0.22);

            /* Glass surface: translucent fill + frosted blur + top specular edge */
            --glass-fill: linear-gradient(160deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.035) 45%, rgba(120, 160, 255, 0.05) 100%);
            --glass-blur: blur(26px) saturate(170%);
            --glass-edge: inset 0 1px 0 rgba(255, 255, 255, 0.20), inset 0 -1px 0 rgba(0, 0, 0, 0.28);

            /* Elevation stack: tight contact shadow + soft ambient + faint accent lift */
            --elev-1: 0 1px 2px rgba(0, 0, 0, 0.45), 0 10px 24px -8px rgba(0, 0, 0, 0.55);
            --elev-2: 0 2px 4px rgba(0, 0, 0, 0.45), 0 18px 40px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(90, 208, 255, 0.06);
            --elev-3: 0 4px 8px rgba(0, 0, 0, 0.5), 0 28px 60px -14px rgba(0, 0, 0, 0.75), 0 0 40px -10px rgba(90, 208, 255, 0.35);

            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
            background:
                radial-gradient(1100px 600px at 12% -10%, rgba(52, 151, 255, 0.16), transparent 60%),
                radial-gradient(900px 600px at 95% 110%, rgba(150, 76, 255, 0.16), transparent 60%),
                linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
            -webkit-font-smoothing: antialiased;
        }

        /* ------------------------------------------------------------------
           Head unit frame (16:9, sized like a 1280x720 display)
           ------------------------------------------------------------------ */
        .dashboard {
            position: relative;
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            padding: 22px;
            border-radius: 32px;
            border: 1px solid var(--line);
            overflow: hidden;
            background:
                radial-gradient(700px 420px at 50% -15%, rgba(90, 208, 255, 0.20), transparent 65%),
                radial-gradient(520px 420px at 105% 105%, rgba(139, 123, 255, 0.22), transparent 65%),
                radial-gradient(420px 320px at -5% 100%, rgba(255, 95, 176, 0.10), transparent 65%),
                linear-gradient(120deg, var(--bg-2) 0%, var(--bg-1) 50%, #130f2c 100%);
            box-shadow:
                0 40px 120px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            display: grid;
            grid-template-columns: 250px 1fr 330px;
            grid-template-rows: auto 1fr auto;
            gap: 18px;
        }

        /* Subtle grain so the glass has something to refract */
        .dashboard::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 3px);
            mix-blend-mode: overlay;
        }

        /* ------------------------------------------------------------------
           Glass surface
           ------------------------------------------------------------------ */
        .glass {
            position: relative;
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
            background: var(--glass-fill);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-edge), var(--elev-2);
        }

        /* Specular highlight running along the top edge */
        .glass::before {
            content: "";
            position: absolute;
            inset: 0 18% auto 18%;
            height: 1px;
            border-radius: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            pointer-events: none;
        }

        /* ------------------------------------------------------------------
           Status bar
           ------------------------------------------------------------------ */
        .status-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            border-radius: 20px;
        }

        .brand {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #cfe3ff;
            margin-right: auto;
        }

        .brand small {
            display: block;
            margin-top: 2px;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: none;
            color: var(--muted);
        }

        .clock {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            margin-right: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dim);
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .chip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .chip strong { color: var(--text); font-weight: 600; }

        .chip.good {
            color: #bfffe3;
            border-color: rgba(78, 227, 165, 0.35);
            background: linear-gradient(100deg, rgba(78, 227, 165, 0.18), rgba(90, 208, 255, 0.12));
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--good);
            box-shadow: 0 0 10px var(--good), 0 0 22px rgba(78, 227, 165, 0.5);
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }

        /* ------------------------------------------------------------------
           App rail (left)
           ------------------------------------------------------------------ */
        .app-rail {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            min-height: 0;
        }

        .rail-title {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 2px 6px 6px;
        }

        .app-list { display: flex; flex-direction: column; gap: 10px; }

        .app-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), var(--elev-1);
            cursor: pointer;
            user-select: none;
            transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .app-item:hover {
            transform: translateY(-2px);
            border-color: rgba(90, 208, 255, 0.45);
            background: linear-gradient(120deg, rgba(90, 208, 255, 0.20), rgba(139, 123, 255, 0.16));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), var(--elev-3);
        }

        .app-item:active { transform: translateY(0) scale(0.985); box-shadow: var(--elev-1); }

        .app-item.active {
            border-color: rgba(90, 208, 255, 0.6);
            background: linear-gradient(120deg, rgba(90, 208, 255, 0.24), rgba(139, 123, 255, 0.18));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 0 1px rgba(90, 208, 255, 0.25), var(--elev-2);
        }

        .app-icon {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.45rem;
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -2px 6px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.35);
        }

        .app-meta { min-width: 0; }
        .app-meta h4 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-meta p { font-size: 0.72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-all-apps {
            margin-top: auto;
            width: 100%;
            padding: 13px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            color: #e8f4ff;
            border-radius: var(--radius-md);
            border: 1px solid rgba(90, 208, 255, 0.35);
            background: linear-gradient(100deg, rgba(90, 208, 255, 0.22), rgba(139, 123, 255, 0.24));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), var(--elev-1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-all-apps:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), var(--elev-2); }
        .btn-all-apps svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .rail-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--muted);
            padding: 10px 6px 0;
            border-top: 1px solid var(--line);
        }

        .rail-footer .dot { width: 6px; height: 6px; animation: none; }

        /* ------------------------------------------------------------------
           Instrument cluster (center)
           ------------------------------------------------------------------ */
        .cluster {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 0;
        }

        .gauge {
            position: relative;
            width: 370px;
            height: 370px;
            max-width: 100%;
            display: grid;
            place-items: center;
        }

        /* Halo behind the numerals — soft, breathing glow */
        .gauge::before {
            content: "";
            position: absolute;
            width: 68%;
            height: 68%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 208, 255, 0.30) 0%, rgba(139, 123, 255, 0.14) 40%, transparent 70%);
            filter: blur(22px);
            animation: breathe 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.06); }
        }

        .gauge svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge .track { stroke: rgba(255, 255, 255, 0.07); }
        .gauge .track-inner { stroke: rgba(255, 255, 255, 0.04); }
        .gauge .ticks { stroke: rgba(255, 255, 255, 0.28); }
        .gauge .ticks-minor { stroke: rgba(255, 255, 255, 0.12); }
        .gauge .progress {
            stroke: url(#speedGradient);
            filter: url(#glow);
            transition: stroke-dashoffset 0.6s cubic-bezier(.3,.9,.3,1);
        }
        .gauge .progress-core {
            stroke: rgba(255, 255, 255, 0.85);
            transition: stroke-dashoffset 0.6s cubic-bezier(.3,.9,.3,1);
        }
        .gauge .needle-cap { fill: #fff; filter: url(#glow); transition: transform 0.6s cubic-bezier(.3,.9,.3,1); }

        .speed-readout {
            position: relative;
            z-index: 1;
            text-align: center;
            transform: translateY(-6px);
        }

        .speed-value {
            font-size: 140px;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.07em;
            font-variant-numeric: tabular-nums;
            color: #f6fbff;
            background: linear-gradient(180deg, #ffffff 0%, #dff4ff 45%, #9fdcff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter:
                drop-shadow(0 0 6px rgba(190, 235, 255, 0.85))
                drop-shadow(0 0 22px rgba(90, 208, 255, 0.60))
                drop-shadow(0 0 60px rgba(90, 160, 255, 0.35));
        }

        .speed-unit {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #a9c7ea;
            text-shadow: 0 0 14px rgba(90, 208, 255, 0.5);
        }

        .rpm-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: -6px;
            font-size: 0.78rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .rpm-bar {
            position: relative;
            width: 170px;
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .rpm-bar i {
            position: absolute;
            inset: 0 auto 0 0;
            width: 26%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--good), #9be8ff 70%, var(--danger));
            background-size: 170px 100%;
            box-shadow: 0 0 12px rgba(78, 227, 165, 0.6);
            transition: width 0.6s cubic-bezier(.3,.9,.3,1);
        }

        .rpm-row strong { color: #bfffe3; font-variant-numeric: tabular-nums; letter-spacing: 0; text-shadow: 0 0 14px rgba(78, 227, 165, 0.45); }

        .gear-row { display: flex; gap: 10px; margin-top: 2px; }

        .pill {
            padding: 7px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .pill.on { color: #e7f7ff; border-color: rgba(90, 208, 255, 0.45); background: rgba(90, 208, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 18px rgba(90, 208, 255, 0.25); }

        .btn-maps {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            color: #03111f;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #5ad0ff 0%, #6c8bff 55%, #9b7bff 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 12px 30px -6px rgba(90, 160, 255, 0.6), var(--elev-1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-maps:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 18px 40px -8px rgba(90, 160, 255, 0.75), var(--elev-2); }
        .btn-maps:active { transform: translateY(0) scale(0.98); }
        .btn-maps svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* ------------------------------------------------------------------
           Media (right)
           ------------------------------------------------------------------ */
        .media {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 18px;
            min-height: 0;
        }

        .media-source {
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .media-source .src { display: inline-flex; align-items: center; gap: 8px; color: #b9ffdb; }
        .media-source .src i { width: 8px; height: 8px; border-radius: 50%; background: #1DB954; box-shadow: 0 0 10px #1DB954; }

        .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
        .eq b { width: 3px; height: 40%; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: eq 0.9s ease-in-out infinite; transform-origin: bottom; }
        .eq b:nth-child(2) { animation-delay: 0.15s; height: 90%; }
        .eq b:nth-child(3) { animation-delay: 0.3s; height: 60%; }
        .eq b:nth-child(4) { animation-delay: 0.45s; height: 100%; }
        .media.paused .eq b { animation-play-state: paused; opacity: 0.4; }

        @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

        /* Album art: layered gradient, vinyl disc, sheen, and a blurred colour bleed underneath */
        .art-wrap { position: relative; width: 236px; height: 236px; }

        .art-bleed {
            position: absolute;
            inset: 14px -10px -22px -10px;
            border-radius: 30px;
            background: linear-gradient(135deg, #30b8ff 0%, #6d73ff 50%, #ff5fb0 100%);
            filter: blur(34px);
            opacity: 0.55;
            transform: translateZ(0);
        }

        .art {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            background:
                radial-gradient(120% 90% at 20% 10%, rgba(255, 255, 255, 0.35), transparent 50%),
                radial-gradient(80% 80% at 90% 100%, rgba(255, 95, 176, 0.75), transparent 60%),
                linear-gradient(135deg, #38c3ff 0%, #6d73ff 48%, #b35cff 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.12), var(--elev-3);
            transform: translateZ(0);
        }

        /* Sheen sweeping diagonally across the cover */
        .art::after {
            content: "";
            position: absolute;
            inset: -40%;
            background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.22) 50%, transparent 60%);
            animation: sheen 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sheen { 0%, 60% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }

        .vinyl {
            position: absolute;
            right: -34px;
            bottom: -34px;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #1a1d2b 0 17%, #6d73ff 17% 19%, #14151f 19% 21%, transparent 21%),
                repeating-radial-gradient(circle, #0c0d14 0 2px, #1c1e2a 2px 4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 0 6px rgba(0, 0, 0, 0.25);
            animation: spin 6s linear infinite;
        }

        .vinyl::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 20deg, transparent 0 40%, rgba(255, 255, 255, 0.22) 46%, transparent 52%, transparent 78%, rgba(255, 255, 255, 0.16) 84%, transparent 90%);
        }

        .media.paused .vinyl { animation-play-state: paused; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .art .note {
            position: absolute;
            left: 20px;
            top: 18px;
            width: 40px;
            height: 40px;
            stroke: rgba(255, 255, 255, 0.9);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .track-info { text-align: center; width: 100%; margin-top: 4px; }
        .track-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.86rem; color: var(--muted); margin-top: 3px; }

        .progress { width: 100%; display: grid; gap: 6px; }
        .progress-bar {
            position: relative;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.09);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
        .progress-bar i {
            position: absolute;
            inset: 0 auto 0 0;
            width: 38%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px rgba(90, 208, 255, 0.6);
        }
        .progress-bar i::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            transform: translateY(-50%);
            box-shadow: 0 0 0 3px rgba(90, 208, 255, 0.3), 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

        .controls {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .ctl {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), var(--elev-1);
            color: var(--text);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .ctl svg { width: 20px; height: 20px; fill: currentColor; }
        .ctl.small { width: 40px; height: 40px; color: var(--muted); }
        .ctl.small svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ctl.small.on { color: var(--accent); border-color: rgba(90, 208, 255, 0.4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 0 16px rgba(90, 208, 255, 0.3); }

        .ctl:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), var(--elev-2); }
        .ctl:active { transform: translateY(0) scale(0.94); }

        .ctl.play {
            width: 68px;
            height: 68px;
            border: 0;
            color: #03111f;
            background: linear-gradient(135deg, #5ad0ff 0%, #6c8bff 55%, #9b7bff 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 14px 32px -6px rgba(90, 160, 255, 0.7), 0 0 0 6px rgba(90, 208, 255, 0.10);
        }

        .ctl.play svg { width: 26px; height: 26px; }
        .ctl.play:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 20px 44px -8px rgba(90, 160, 255, 0.85), 0 0 0 8px rgba(90, 208, 255, 0.14); }

        /* ------------------------------------------------------------------
           HUD strip (bottom)
           ------------------------------------------------------------------ */
        .hud {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .hud-card {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 196px;
            padding: 12px 18px;
            border-radius: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hud-card:hover { transform: translateY(-2px); box-shadow: var(--glass-edge), var(--elev-3); }

        .hud-icon {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .hud-icon svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
        .hud-card.warm .hud-icon svg { stroke: var(--warn); }
        .hud-card.good .hud-icon svg { stroke: var(--good); }

        .hud-text { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .hud-label { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
        .hud-value { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .hud-value small { font-size: 0.75rem; font-weight: 500; color: var(--muted); margin-left: 3px; }

        .meter { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 2px; }
        .meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--good), var(--accent)); box-shadow: 0 0 10px rgba(78, 227, 165, 0.5); }

        /* ------------------------------------------------------------------
           All-apps sheet
           ------------------------------------------------------------------ */
        .sheet-backdrop {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            background: rgba(3, 5, 12, 0.55);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .sheet-backdrop.open { display: flex; }

        .sheet {
            width: 100%;
            max-width: 900px;
            max-height: 100%;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-color: rgba(90, 208, 255, 0.28);
            box-shadow: var(--glass-edge), var(--elev-3);
            animation: rise 0.25s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }

        .sheet-head { display: flex; align-items: center; justify-content: space-between; }
        .sheet-head h3 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
        .sheet-head p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

        .btn-close {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-close:hover { background: rgba(255, 93, 122, 0.25); transform: scale(1.06); }

        .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; overflow: auto; }

        /* ------------------------------------------------------------------
           Motion + responsive
           ------------------------------------------------------------------ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        @media (max-width: 1100px) {
            .dashboard { grid-template-columns: 220px 1fr 290px; }
            .gauge { width: 310px; height: 310px; }
            .speed-value { font-size: 112px; }
            .art-wrap { width: 200px; height: 200px; }
            .hud-card { min-width: 160px; }
        }

        @media (max-width: 900px) {
            body { padding: 12px; }
            .dashboard { aspect-ratio: auto; grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; }
            .hud, .status-bar { flex-wrap: wrap; }
            .sheet-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- Status bar -->
        <header class="status-bar glass">
            <div class="brand">OpenAuto Dash<small>Citroën C4 Picasso</small></div>

            <div class="clock" id="clock">12:48</div>

            <div class="chip good">
                <span class="dot"></span>
                OBD <strong>Connected</strong>
            </div>

            <div class="chip">
                <svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4"/><rect x="4.5" y="9.5" width="10" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
                Battery <strong>85%</strong>
            </div>

            <div class="chip">
                <svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v6"/></svg>
                Coolant <strong>92°C</strong>
            </div>

            <div class="chip">
                <svg viewBox="0 0 24 24"><path d="M5 12.5a7 7 0 0 1 14 0"/><path d="M2 17.5a10 10 0 0 1 20 0"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
                <strong>LTE</strong>
            </div>
        </header>

        <!-- App rail -->
        <aside class="app-rail glass">
            <div class="rail-title">Apps</div>
            <div class="app-list" id="apps-container"></div>

            <button class="btn-all-apps" id="btn-all-apps" onclick="toggleAllApps()">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                <span id="all-apps-label">All apps</span>
            </button>

            <div class="rail-footer"><span class="dot"></span> All apps ready</div>
        </aside>

        <!-- Instrument cluster -->
        <section class="cluster">
            <div class="gauge">
                <svg viewBox="0 0 400 400" aria-hidden="true">
                    <defs>
                        <linearGradient id="speedGradient" x1="0" y1="1" x2="1" y2="0">
                            <stop offset="0%" stop-color="#4ee3a5"/>
                            <stop offset="55%" stop-color="#5ad0ff"/>
                            <stop offset="100%" stop-color="#9b7bff"/>
                        </linearGradient>
                        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur stdDeviation="6" result="b"/>
                            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <g id="ticks"></g>
                    <circle class="track-inner" cx="200" cy="200" r="150" fill="none" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="75 25" transform="rotate(135 200 200)"/>
                    <circle class="track" cx="200" cy="200" r="176" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="75 25" transform="rotate(135 200 200)"/>
                    <circle class="progress" id="arc" cx="200" cy="200" r="176" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="75 25" stroke-dashoffset="0" transform="rotate(135 200 200)"/>
                    <circle class="progress-core" id="arc-core" cx="200" cy="200" r="176" fill="none" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="75 25" stroke-dashoffset="0" transform="rotate(135 200 200)"/>
                    <circle class="needle-cap" id="needle" cx="200" cy="24" r="7" transform="rotate(-135 200 200)"/>
                </svg>

                <div class="speed-readout">
                    <div class="speed-value" id="speed">87</div>
                    <div class="speed-unit">km/h</div>
                </div>
            </div>

            <div class="rpm-row">
                <span>RPM</span>
                <span class="rpm-bar"><i id="rpm-bar"></i></span>
                <strong id="rpm">1 850</strong>
            </div>

            <div class="gear-row">
                <span class="pill">P</span>
                <span class="pill">R</span>
                <span class="pill">N</span>
                <span class="pill on">D</span>
                <span class="pill">ECO</span>
            </div>

            <button class="btn-maps" id="btn-maps" onclick="launchFromPanel('right')">
                <svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
                Expand Maps
            </button>
        </section>

        <!-- Media -->
        <section class="media glass" id="media">
            <div class="media-source">
                <span class="src"><i></i> Spotify</span>
                <span class="eq"><b></b><b></b><b></b><b></b></span>
            </div>

            <div class="art-wrap">
                <div class="art-bleed"></div>
                <div class="art">
                    <svg class="note" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
                    <div class="vinyl"></div>
                </div>
            </div>

            <div class="track-info">
                <div class="track-title">Midnight Drive</div>
                <div class="track-artist">Electronic Dreams</div>
            </div>

            <div class="progress">
                <div class="progress-bar"><i id="progress-fill"></i></div>
                <div class="progress-time"><span id="t-cur">1:27</span><span id="t-tot">3:48</span></div>
            </div>

            <div class="controls">
                <button class="ctl small on" aria-label="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
                </button>
                <button class="ctl" aria-label="Previous track">
                    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
                </button>
                <button class="ctl play" id="btn-play" aria-label="Pause" onclick="togglePlay()">
                    <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                    <svg id="icon-play" viewBox="0 0 24 24" style="display:none"><path d="M7 4v16l14-8z"/></svg>
                </button>
                <button class="ctl" aria-label="Next track">
                    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
                </button>
                <button class="ctl small" aria-label="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
        </section>

        <!-- HUD strip -->
        <footer class="hud">
            <div class="hud-card glass warm">
                <div class="hud-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
                <div class="hud-text"><span class="hud-label">Outside</span><span class="hud-value">24<small>°C</small></span></div>
            </div>

            <div class="hud-card glass good">
                <div class="hud-icon"><svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M2 20h14"/><path d="M14 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg></div>
                <div class="hud-text"><span class="hud-label">Fuel</span><span class="hud-value">68<small>%</small></span><span class="meter"><i style="width:68%"></i></span></div>
            </div>

            <div class="hud-card glass">
                <div class="hud-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
                <div class="hud-text"><span class="hud-label">Trip time</span><span class="hud-value">45<small>min</small></span></div>
            </div>

            <div class="hud-card glass">
                <div class="hud-icon"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div>
                <div class="hud-text"><span class="hud-label">Range</span><span class="hud-value">412<small>km</small></span></div>
            </div>
        </footer>

        <!-- All-apps sheet -->
        <div class="sheet-backdrop" id="allAppsModal" onclick="if (event.target === this) toggleAllApps()">
            <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
                <div class="sheet-head">
                    <div>
                        <h3 id="sheet-title">All apps</h3>
                        <p id="sheet-sub"></p>
                    </div>
                    <button class="btn-close" onclick="toggleAllApps()" aria-label="Close">✕</button>
                </div>
                <div class="sheet-grid" id="all-apps-container"></div>
            </div>
        </div>
    </div>

    <script>
        // ---------- helpers ----------
        function darken(hex, amount) {
            const value = hex.replace('#', '');
            const channels = [0, 2, 4].map(offset => Math.max(0, parseInt(value.slice(offset, offset + 2), 16) - amount));
            return `#${channels.map(channel => channel.toString(16).padStart(2, '0')).join('')}`;
        }

        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

        // ---------- mock installed apps (production: Android PackageManager) ----------
        const installedApps = [
            { name: 'Google Maps',      icon: '🗺️', package: 'com.google.android.apps.maps',          color: '#4285F4', hint: 'Navigation' },
            { name: 'Spotify',          icon: '🎵', package: 'com.spotify.music',                     color: '#1DB954', hint: 'Now playing' },
            { name: 'YouTube Music',    icon: '🎬', package: 'com.google.android.apps.youtube.music', color: '#FF0000', hint: 'Music' },
            { name: 'Podcasts',         icon: '🎙️', package: 'com.google.android.apps.podcasts',      color: '#FFA000', hint: 'Podcasts' },
            { name: 'Google Assistant', icon: '🔊', package: 'com.google.android.apps.mediashell',    color: '#34A853', hint: 'Voice' },
            { name: 'Settings',         icon: '⚙️', package: 'com.android.settings',                  color: '#64748B', hint: 'System settings' },
            { name: 'Calendar',         icon: '📅', package: 'com.android.calendar',                  color: '#2196F3', hint: 'Agenda' },
            { name: 'Photos',           icon: '🖼️', package: 'com.google.android.apps.photos',        color: '#FF5722', hint: 'Gallery' },
            { name: 'Contacts',         icon: '👥', package: 'com.google.android.contacts',           color: '#8BC34A', hint: 'People' },
            { name: 'Chrome',           icon: '🌐', package: 'com.android.chrome',                    color: '#F59E0B', hint: 'Browser' },
        ];

        const displayLimit = 5;
        const displayedApps = installedApps.slice(0, displayLimit);
        const remainingCount = installedApps.length - displayLimit;

        function appItemHtml(app, extraClass = '') {
            const gradient = `linear-gradient(135deg, ${app.color}, ${darken(app.color, 48)})`;
            return `
                <div class="app-item ${extraClass}" data-package="${app.package}" onclick="launchApp('${app.package}')">
                    <div class="app-icon" style="background: ${gradient};">${app.icon}</div>
                    <div class="app-meta">
                        <h4>${app.name}</h4>
                        <p>${app.hint}</p>
                    </div>
                </div>`;
        }

        function renderApps() {
            document.getElementById('apps-container').innerHTML = displayedApps.map(app => appItemHtml(app)).join('');
            if (remainingCount > 0) {
                document.getElementById('all-apps-label').textContent = `${remainingCount} more apps`;
            }
        }

        function toggleAllApps() {
            const modal = document.getElementById('allAppsModal');
            if (modal.classList.contains('open')) {
                modal.classList.remove('open');
                return;
            }
            document.getElementById('all-apps-container').innerHTML = installedApps.map(app => appItemHtml(app)).join('');
            document.getElementById('sheet-sub').textContent = `${installedApps.length} installed · tap to launch`;
            modal.classList.add('open');
        }

        function launchApp(packageName) {
            const app = installedApps.find(a => a.package === packageName);
            console.log(`Launching ${packageName}`);

            document.querySelectorAll('.app-item').forEach(item => {
                item.classList.toggle('active', item.dataset.package === packageName);
            });
            document.getElementById('allAppsModal').classList.remove('open');

            // In the real launcher this starts the activity in the chosen split pane.
            window.dispatchEvent(new CustomEvent('appLaunched', { detail: { packageName, app } }));
        }

        function launchFromPanel(panel) {
            if (panel === 'right') {
                const maps = installedApps.find(app => app.name === 'Google Maps');
                if (maps) {
                    launchApp(maps.package);
                    const btn = document.getElementById('btn-maps');
                    btn.lastChild.textContent = ` Launching ${maps.name}…`;
                    setTimeout(() => { btn.lastChild.textContent = ' Expand Maps'; }, 1800);
                }
            } else {
                launchApp(displayedApps[0].package);
            }
        }

        // ---------- gauge ----------
        const MAX_SPEED = 240;   // gauge sweep = 270°, so 0 → 240 km/h maps to 75 pathLength units
        const MAX_RPM = 6500;

        function buildTicks() {
            const g = document.getElementById('ticks');
            let html = '';
            for (let i = 0; i <= 48; i++) {
                const major = i % 4 === 0;
                const angle = -135 + (i / 48) * 270;
                const r1 = major ? 152 : 158;
                const r2 = 164;
                html += `<line class="${major ? 'ticks' : 'ticks-minor'}" x1="200" y1="${200 - r1}" x2="200" y2="${200 - r2}" stroke-width="${major ? 2.2 : 1.2}" stroke-linecap="round" transform="rotate(${angle} 200 200)"/>`;
                if (major) {
                    const label = (i / 48) * MAX_SPEED;
                    const rad = (angle - 90) * Math.PI / 180;
                    const x = 200 + Math.cos(rad) * 138;
                    const y = 200 + Math.sin(rad) * 138;
                    html += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="rgba(255,255,255,0.35)" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif">${label}</text>`;
                }
            }
            g.innerHTML = html;
        }

        function setSpeed(kmh) {
            const frac = clamp(kmh / MAX_SPEED, 0, 1);
            const offset = 75 * (1 - frac);
            document.getElementById('arc').setAttribute('stroke-dashoffset', offset);
            document.getElementById('arc-core').setAttribute('stroke-dashoffset', offset);
            document.getElementById('needle').setAttribute('transform', `rotate(${-135 + frac * 270} 200 200)`);
            document.getElementById('speed').textContent = Math.round(kmh);
        }

        function setRpm(rpm) {
            const frac = clamp(rpm / MAX_RPM, 0, 1);
            document.getElementById('rpm-bar').style.width = `${frac * 100}%`;
            document.getElementById('rpm').textContent = Math.round(rpm).toLocaleString('fr-FR');
        }

        // Gentle demo drift so the glow and arc feel alive (replace with OBD feed).
        let speed = 87, rpm = 1850;
        function demoTick() {
            speed = clamp(speed + (Math.random() - 0.5) * 6, 60, 118);
            rpm = clamp(1400 + speed * 14 + (Math.random() - 0.5) * 200, 900, 3200);
            setSpeed(speed);
            setRpm(rpm);
        }

        // ---------- media ----------
        const TRACK_LENGTH = 228;
        let position = 87;
        let playing = true;

        function renderProgress() {
            document.getElementById('progress-fill').style.width = `${(position / TRACK_LENGTH) * 100}%`;
            document.getElementById('t-cur').textContent = fmtTime(position);
            document.getElementById('t-tot').textContent = fmtTime(TRACK_LENGTH);
        }

        function togglePlay() {
            playing = !playing;
            document.getElementById('media').classList.toggle('paused', !playing);
            document.getElementById('icon-pause').style.display = playing ? '' : 'none';
            document.getElementById('icon-play').style.display = playing ? 'none' : '';
            document.getElementById('btn-play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
        }

        document.querySelector('.progress-bar').addEventListener('click', e => {
            const rect = e.currentTarget.getBoundingClientRect();
            position = clamp((e.clientX - rect.left) / rect.width, 0, 1) * TRACK_LENGTH;
            renderProgress();
        });

        // ---------- clock ----------
        function tickClock() {
            const d = new Date();
            document.getElementById('clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // ---------- init ----------
        document.addEventListener('DOMContentLoaded', () => {
            renderApps();
            buildTicks();
            setSpeed(speed);
            setRpm(rpm);
            renderProgress();
            tickClock();

            setInterval(demoTick, 1800);
            setInterval(() => { if (playing) { position = (position + 1) % TRACK_LENGTH; renderProgress(); } }, 1000);
            setInterval(tickClock, 15000);
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('allAppsModal').classList.remove('open');
            if (e.key === ' ' && e.target === document.body) { e.preventDefault(); togglePlay(); }
        });
    </script>
</body>
</html>

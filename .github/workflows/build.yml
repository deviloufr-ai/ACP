name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          PATH: ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin:$PATH
      
      - name: Setup Android SDK (Legacy Method)
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: '34.0.0'
          android-sdk-packages: 'platforms;android-34,build-tools;34.0.0,platform-tools'
      
      - name: Build APK
        run: ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openauto-dash-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: skip
name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Needed so the build can publish a GitHub Release with the APK.
permissions:
  contents: write

jobs:
  build:
    name: Assemble & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags so the release notes can list every commit
          # since the previous release.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default ("tools platform-tools"); the obsolete
          # "tools" package was removed from the SDK repo and breaks the step.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Release keystore prepared."
          else
            echo "No KEYSTORE_BASE64 secret set — the release APK will be signed with the"
            echo "debug key. It installs fine, but updates won't replace an install signed"
            echo "with a different key until a persistent keystore secret is added."
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openauto-dash-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Readable changelog: one section per commit since the previous release,
      # using the commit subject as the heading and its body as the details.
      # Commit bodies are written as user-facing notes, so this reads as a
      # changelog rather than a bare "Full Changelog" link.
      - name: Write release notes
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..HEAD}
          {
            echo "## What's new in v1.0.${{ github.run_number }}"
            echo
            git log $range --no-merges -n 30 --format='### %s%n%n%b' \
              | sed -e '/^Co-Authored-By:/d' -e '/^Signed-off-by:/d'
            if [ -n "$prev" ]; then
              echo
              echo "_Changes since ${prev}._"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OpenAuto Dash v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          body_path: ${{ runner.temp }}/release-notes.md

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">

  <!-- Background -->
  <circle cx="48" cy="48" r="47.04" fill="#0F1115"/>

  <!-- Speedometer Arc (Primary Visual Element) - Blue telemetry color -->
  <path d="M 21.6 48 A 79.2 79.2 0 0 1 74.4 48 Z" 
        fill="none" stroke="#81D4FA" stroke-width="5.76" 
        stroke-linecap="round"/>

  <!-- Inner Circle (Dashboard Hub) - Surface color -->
  <circle cx="48" cy="48" r="14.4" fill="#1C1E24"/>

  <!-- Vertical Speed Line in Center -->
  <line x1="48" y1="35.2" x2="48" y2="60.8" 
        stroke="#FFD4AA" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Navigation Icon at Bottom (Primary color) -->
  <circle cx="48" cy="72" r="14.4" fill="#6750A4"/>
  <path d="M 45.6 67.2 L 50.4 67.2 M 48 38.4 L 48 75.2" 
        stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Compass Points (White) -->
  <line x1="48" y1="39.2" x2="48" y2="56.8" 
        stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="37.2" y1="48" x2="58.8" y2="48" 
        stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- OpenAuto Logo - Stylized OA mark (Primary purple) -->
  <rect x="18.2" y="53" width="6.5" height="25.5" 
        stroke="#6750A4" stroke-width="1.6" rx="1.5"/>
  <rect x="29.9" y="53" width="3" height="25.5" 
        stroke="#6750A4" stroke-width="1.6" rx="0.6"/>

</svg>
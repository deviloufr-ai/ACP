<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">

  <!-- Background -->
  <circle cx="24" cy="24" r="23.52" fill="#0F1115"/>

  <!-- Speedometer Arc (Primary Visual Element) - Blue telemetry color -->
  <path d="M 7.2 24 A 38.04 38.04 0 0 1 40.8 24 Z" 
        fill="none" stroke="#81D4FA" stroke-width="2.88" 
        stroke-linecap="round"/>

  <!-- Inner Circle (Dashboard Hub) - Surface color -->
  <circle cx="24" cy="24" r="7.2" fill="#1C1E24"/>

  <!-- Vertical Speed Line in Center -->
  <line x1="24" y1="16" x2="24" y2="32" 
        stroke="#FFD4AA" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Navigation Icon at Bottom (Primary color) -->
  <circle cx="24" cy="30" r="7.2" fill="#6750A4"/>
  <path d="M 22.8 28.8 L 25.2 28.8 M 24 21.6 L 24 29.6" 
        stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Compass Points (White) -->
  <line x1="24" y1="15.6" x2="24" y2="24.4" 
        stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18.6" y1="24" x2="27.4" y2="24" 
        stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- OpenAuto Logo - Stylized OA mark (Primary purple) -->
  <rect x="9.1" y="26.5" width="3.25" height="12.5" 
        stroke="#6750A4" stroke-width="0.8" rx="0.75"/>
  <rect x="15.65" y="26.5" width="1.5" height="12.5" 
        stroke="#6750A4" stroke-width="0.8" rx="0.3"/>

</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">

  <!-- Background -->
  <circle cx="72" cy="72" r="95.28" fill="#0F1115"/>

  <!-- Speedometer Arc (Primary Visual Element) - Blue telemetry color -->
  <path d="M 23.64 72 A 156.12 156.12 0 0 1 120.36 72 Z" 
        fill="none" stroke="#81D4FA" stroke-width="10.56" 
        stroke-linecap="round"/>

  <!-- Inner Circle (Dashboard Hub) - Surface color -->
  <circle cx="72" cy="72" r="24" fill="#1C1E24"/>

  <!-- Vertical Speed Line in Center -->
  <line x1="72" y1="57.6" x2="72" y2="86.4" 
        stroke="#FFD4AA" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Navigation Icon at Bottom (Primary color) -->
  <circle cx="72" cy="96" r="24" fill="#6750A4"/>
  <path d="M 68.4 86.4 L 75.6 86.4 M 72 64.8 L 72 105.6" 
        stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Compass Points (White) -->
  <line x1="72" y1="64.8" x2="72" y2="96" 
        stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="55.2" y1="72" x2="88.8" y2="72" 
        stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- OpenAuto Logo - Stylized OA mark (Primary purple) -->
  <rect x="31.65" y="95.25" width="11.25" height="41.25" 
        stroke="#6750A4" stroke-width="2.4" rx="2.25"/>
  <rect x="51.45" y="95.25" width="5.25" height="41.25" 
        stroke="#6750A4" stroke-width="2.4" rx="1"/>

</svg>
<EOF>
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1b1d22; }
    #map { background: #1b1d22; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script>
    var mapEl = document.getElementById('map');
    // The WebView viewport height collapses, so size #map from the real WebView
    // pixels and force a reflow BEFORE Leaflet reads the size (else tiles offset).
    function fit() {
      mapEl.style.width = window.innerWidth + 'px';
      mapEl.style.height = window.innerHeight + 'px';
    }
    fit();
    void mapEl.offsetHeight;

    // Force 2D positioning (translate3d layers render black on some GPUs).
    L.Browser.any3d = false;
    var map = L.map('map', {
      zoomControl: true, fadeAnimation: false, zoomAnimation: false, markerZoomAnimation: false
    }).setView([48.8566, 2.3522], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    window.addEventListener('resize', function () { fit(); map.invalidateSize(); });
    setTimeout(function () { fit(); map.invalidateSize(); }, 500);

    var marker = null, centered = false;
    // Called natively (LocationManager) and by the geolocation watcher below.
    window.setCenter = function (lat, lng) {
      var ll = [lat, lng];
      if (marker) { marker.setLatLng(ll); }
      else { marker = L.circleMarker(ll, { radius: 8, color: '#8AB4F8', fillColor: '#8AB4F8', fillOpacity: 1 }).addTo(map); }
      if (!centered) { map.setView(ll, 16); centered = true; }
    };
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        function (p) { setCenter(p.coords.latitude, p.coords.longitude); },
        function (e) {},
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
      );
    }
  </script>
</body>
</html>

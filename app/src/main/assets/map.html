<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <link rel="stylesheet" href="leaflet.css" />
  <style>html,body,#map{height:100%;margin:0;background:#1b1d22}</style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script>
    var map = L.map('map', { zoomControl: true }).setView([48.8566, 2.3522], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker = null, centered = false;
    // Called by the app (native geolocation) and by the browser watcher below.
    function setCenter(lat, lng) {
      var ll = [lat, lng];
      if (marker) { marker.setLatLng(ll); }
      else { marker = L.circleMarker(ll, { radius: 8, color: '#8AB4F8', fillColor: '#8AB4F8', fillOpacity: 1 }).addTo(map); }
      if (!centered) { map.setView(ll, 16); centered = true; }
    }
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        function (p) { setCenter(p.coords.latitude, p.coords.longitude); },
        function (e) {},
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
